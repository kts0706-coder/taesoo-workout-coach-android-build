name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify and extract v3.7.1 source and photos
        run: |
          echo "e4edc189e592dd882f2644438784446cac3257b23ff50a21ba3a3ebc549c8ca5  kim-taesoo-workout-coach-v3.7.1-build-source.zip" | sha256sum -c -
          echo "dc59a18036adbe804afecf89a2d39497f1b97d30394b5769f727796b2060b641  kim-taesoo-workout-coach-v3.6.0-photos.zip" | sha256sum -c -
          echo "f1c4a7339a1b6c56669424e885de60f85aaa2110ce5a04939988274d78881a25  kim-taesoo-workout-coach-v3.7.0-photos-1.zip" | sha256sum -c -
          echo "d43ba9b5adcf8ceace401e5010ba3fc652f92b32427c761f961a2798429db2c1  kim-taesoo-workout-coach-v3.7.0-photos-2.zip" | sha256sum -c -
          unzip -q -o kim-taesoo-workout-coach-v3.7.1-build-source.zip
          unzip -q -o kim-taesoo-workout-coach-v3.6.0-photos.zip
          unzip -q -o kim-taesoo-workout-coach-v3.7.0-photos-1.zip
          unzip -q -o kim-taesoo-workout-coach-v3.7.0-photos-2.zip
          echo "875bc5db5bc96f2c7b2bfda5f94181617b1a58128a02ec3df711b5b558b3c7c6  kim-taesoo-workout-coach-v3.7.1-sdk-fix.zip" | sha256sum -c -
          unzip -q -o kim-taesoo-workout-coach-v3.7.1-sdk-fix.zip

      - name: Validate workout data and saved records
        run: |
          node tests/activity-records.cjs
          node tests/pdf-programs.cjs
          node tests/core-programs.cjs
          node tests/health-sync.cjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kim-taesoo-workout-coach-apk-v3.7.1
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
